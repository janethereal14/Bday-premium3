<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Golden Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
            --cream: #fdfbf7;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            /* Smooth scroll adjusted for elegance */
            scroll-behavior: smooth;
        }

        /* Background Emoji Rain */
        .emoji {
            position: fixed;
            top: -50px;
            font-size: 2rem;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .page {
            display: none;
            min-height: 100vh;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            text-align: center;
        }

        .active { display: flex; }

        /* Larger Typography */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 10vw, 6rem); /* Made Slightly Bigger */
            letter-spacing: 4px;
            background: linear-gradient(to right, #fbf5e6, #d4af37, #fbf5e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }

        .premium-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 22px 55px; /* Bigger button */
            font-size: 1.1rem; /* Bigger text */
            letter-spacing: 4px;
            text-transform: uppercase;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .premium-btn:hover {
            background: var(--gold);
            color: var(--dark);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
            transform: scale(1.05);
        }

        /* Page 2: Refined Timer & Slow Scroll */
        #timer-display {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem; /* Bigger Timer */
            color: var(--gold);
            margin-bottom: 150px;
            padding: 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            letter-spacing: 2px;
        }

        .luxury-para {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem; /* Significantly Bigger Text */
            margin-bottom: 90vh; /* More space for slower movement */
            line-height: 1.4;
            opacity: 0;
            transform: translateY(50px);
            transition: all 2.5s ease-out; /* Slower fade & lift */
            max-width: 900px;
            word-wrap: break-word;
        }

        .luxury-para.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Page 4: Custom Gift Grid */
        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }

        .gift-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .gift-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.5s;
        }

        /* The Video Gift (Bigger & Centered) */
        .video-gift {
            width: 180px;
            height: 180px;
            font-size: 4.5rem;
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .gift-card:hover { 
            border-color: var(--gold); 
            background: rgba(212, 175, 55, 0.15); 
            transform: translateY(-10px) rotate(3deg); 
        }

        /* Modal / Overlay */
        #gift-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.97);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
        }

        #media-content img, #media-content video {
            max-width: 85vw;
            max-height: 75vh;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.5);
        }

        #final-msg {
            margin-top: 60px;
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold);
            opacity: 0;
            transition: 3s opacity ease-in-out;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="Saja_Boys_Ft_Andrew_Choi_neckwav_Danny_Chung_Kevin_Woo_SamUIL_KPop_Demon_Hunters_Cast_-_Soda_Pop_thinknews.com.ng.mp3" type="audio/mpeg">
    </audio>

    <section id="p1" class="page active">
        <h1>A Grand Occasion</h1>
        <button class="premium-btn" onclick="initiate()">Click Here</button>
    </section>

    <section id="p2" class="page" style="height: auto; justify-content: flex-start; padding-top: 100px;">
        <div id="timer-display">Initialising Journey...</div>
        <div class="content-section">
            <p class="luxury-para" id="text1">Since August 14, 2008,</p>
            <p class="luxury-para" id="text2">The world has been graced by your light.</p>
            <p class="luxury-para" id="text3">You are a masterpiece in motion.<br> See down👇...</p>
            <button id="wishBtn" class="premium-btn" style="display: none; margin-bottom: 150px;" onclick="toCake()">Wish Now</button>
        </div>
    </section>

    <section id="p3" class="page">
        <h2 id="countdown-text" style="font-size: 6rem; color: var(--gold);">3</h2>
        <div style="font-size: 120px;">🎂<span id="flame" style="animation: flicker 0.1s infinite alternate; display: inline-block;">🕯️</span></div>
        <p style="letter-spacing: 8px; text-transform: uppercase; margin-top: 30px; font-size: 1.2rem;">Make a wish</p>
    </section>

    <section id="p4" class="page">
        <h1>Your Curated Gifts</h1>
        <div class="gift-container">
            <div class="gift-row">
                <div class="gift-card" onclick="openGift(1)">🎁</div>
                <div class="gift-card" onclick="openGift(2)">🎁</div>
            </div>
            <div class="gift-row">
                <div class="gift-card" onclick="openGift(3)">🎁</div>
                <div class="gift-card" onclick="openGift(4)">🎁</div>
            </div>
            <div class="gift-card video-gift" onclick="openGift(5)">🎁</div>
        </div>
        <div id="final-msg">You are loved 💖</div>
    </section>

    <div id="gift-overlay">
        <div id="media-content"></div>
        <button class="premium-btn" style="margin-top:40px;" onclick="closeGift()">Close</button>
    </div>

    <script>
        const birthDate = new Date('August 14, 2008 00:00:00');

        function createEmoji() {
            const emojis = ['✨','🎉','🎊','🎂','💖'];
            const e = document.createElement('div');
            e.className = 'emoji';
            e.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            e.style.left = Math.random() * 100 + 'vw';
            e.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(e);
            setTimeout(() => e.remove(), 8000);
        }
        setInterval(createEmoji, 500);

        function initiate() {
            document.getElementById('bgMusic').play();
            switchPage('p1', 'p2');
            startTimer();
            
            // Slow & Smooth Reveal Sequence
            setTimeout(() => { 
                revealText('text1', 400); 
            }, 3000);
            
            setTimeout(() => { 
                revealText('text2', 1200); 
            }, 8000); // 5-second gap between paras
            
            setTimeout(() => { 
                revealText('text3', 2000); 
                document.getElementById('wishBtn').style.display = 'inline-block';
            }, 13000);
        }

        function revealText(id, scrollPos) {
            const el = document.getElementById(id);
            el.classList.add('visible');
            window.scrollTo({top: scrollPos, behavior: 'smooth'});
        }

        function startTimer() {
            setInterval(() => {
                const now = new Date();
                const diff = now - birthDate;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const months = Math.floor(days / 30.44);
                const seconds = Math.floor(diff / 1000);
                document.getElementById('timer-display').innerHTML = 
                    `${months} MONTHS — ${days} DAYS — ${seconds} SECONDS`;
            }, 1000);
        }

        function toCake() {
            window.scrollTo(0,0);
            switchPage('p2', 'p3');
            let count = 3;
            const cd = document.getElementById('countdown-text');
            const timer = setInterval(() => {
                count--;
                if(count > 0) cd.innerText = count;
                if(count === 0) {
                    clearInterval(timer);
                    cd.innerText = "✨";
                    document.getElementById('flame').style.display = 'none';
                    setTimeout(() => switchPage('p3', 'p4'), 1500);
                }
            }, 1000);
        }

        function openGift(num) {
            const overlay = document.getElementById('gift-overlay');
            const container = document.getElementById('media-content');
            overlay.style.display = 'flex';

            // EDIT YOUR FILE NAMES HERE
            if (num === 1) container.innerHTML = `<img src="Screenshot_2026-05-04-15-34-31-232.jpeg">`;
            if (num === 2) container.innerHTML = `<img src="Screenshot_2026-05-04-15-30-22-145.jpeg">`;
            if (num === 3) container.innerHTML = `<img src="Screenshot_2026-05-04-15-49-55-674.jpeg">`;
            if (num === 4) container.innerHTML = `<img src="Screenshot_2026-05-04-15-51-20-647.jpeg">`;
            if (num === 5) {
                // Video box triggers the final message
                container.innerHTML = `<video controls autoplay><source src="VID-20260328-WA0025.mp4" type="video/mp4"></video>`;
                setTimeout(() => {
                    document.getElementById('final-msg').style.opacity = '1';
                }, 500);
            }
        }

        function closeGift() {
            document.getElementById('gift-overlay').style.display = 'none';
            document.getElementById('media-content').innerHTML = '';
        }

        function switchPage(oldId, newId) {
            document.getElementById(oldId).classList.remove('active');
            document.getElementById(newId).classList.add('active');
        }
    </script>
</body>
  </html>
